<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
{% extends "index.html" %}
{% block content %}
<form method="post" enctype="multipart/form-data">
    <h2>{{ 'Edit post' if post else 'New post' }}</h2>
    <input type="text" name="title" placeholder="Title" value="{{ post.title if post else '' }}" required>
    <textarea name="text" placeholder="Text" required>{{ post.text if post else '' }}</textarea>
    <input type="file" name="image" accept="image/*" {{ '' if post else 'required' }}>
    <button type="submit">Save</button>
</form>
{% endblock %}

</body>
</html>
